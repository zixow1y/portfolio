<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>미리보기 편집기</title>
<style>
:root{--bg:#eeeeee;--panel:#fff;--ink:#2f2f2f;--muted:#666;--line:#dcdcdc;--accent:#505050}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:16px;margin:0 auto 0 0}
.bar button{font:inherit;font-size:14px;padding:9px 16px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;font-weight:700}
.bar button.ghost{background:#e6e6e6;color:var(--ink)}
.bar .msg{font-size:13px;color:var(--muted)}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:380px 1fr}
.form{overflow:auto;padding:16px;background:var(--panel);border-right:1px solid var(--line)}
.prev{min-width:0;padding:12px}
.prev iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 14px;padding:12px 14px}
legend{font-weight:700;font-size:14px;padding:0 6px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafafa;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px}.row>div{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);margin-top:10px}
details{margin-top:10px}summary{cursor:pointer;font-size:13px;font-weight:700}
.item{border-top:1px dashed var(--line);margin-top:8px;padding-top:4px}
.mrow{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 0;border-bottom:1px dotted var(--line)}
.mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow button{font:inherit;font-size:12px;border:0;border-radius:6px;background:#e6e6e6;color:var(--ink);padding:3px 8px;cursor:pointer}
.mrow img,.mrow video{width:34px;height:34px;object-fit:cover;border-radius:6px;background:#ddd}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.slot{position:relative}
.slotb{margin:0;position:relative;display:block;aspect-ratio:1;border:2px dashed #aaa;border-radius:10px;background:#f1f1f1;overflow:hidden;cursor:pointer}
.slotb:hover{border-color:var(--accent);background:#e9e9e9}
.slotb.filled{border-style:solid;border-color:var(--accent)}
.slotb img,.slotb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slotb .plus{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#888}
.slotb.has .plus{display:none}
.slotb .no{position:absolute;left:4px;top:3px;z-index:2;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 5px}
.slotb input{display:none}
.slot .rm{position:absolute;right:3px;top:3px;z-index:3;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:11px;cursor:pointer;padding:0}
button.sm{font:inherit;font-size:12px;border:0;border-radius:999px;background:#e6e6e6;color:var(--ink);padding:6px 12px;cursor:pointer}
.up{display:block;margin-top:10px;padding:10px;border:1px dashed #999;border-radius:10px;text-align:center;font-size:13px;color:var(--ink);cursor:pointer;background:#f4f4f4}
.up input{display:none}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 14px}
#err{display:none;padding:12px 16px;background:#fff3cd;font-size:13px}
@media(max-width:900px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 70vh}.form{max-height:50vh}}
</style>
</head>
<body>
<div class="bar">
  <h1>미리보기 편집기</h1>
  <span class="msg" id="msg"></span>
  <button class="ghost" id="reset" type="button">처음으로 되돌리기</button>
  <button class="ghost" id="zip" type="button">사진·영상 포함 zip 받기</button>
  <button id="copy" type="button">config.js 복사</button>
  <button id="dl" type="button">config.js 다운로드</button>
</div>
<div id="err"></div>
<div class="wrap">
  <div class="form" id="form">
    <p class="hint">왼쪽에서 글자를 고치면 오른쪽에 바로 반영돼요. 마음에 들면 위의 <b>config.js 복사</b>를 눌러 GitHub 의 config.js 에 붙여넣고 Commit 하세요. (이 화면에서 바꾼 내용은 아직 사이트에 저장되지 않아요.) 사진은 각 섹션의 네모 칸을 눌러 한 장씩 넣고, 다 넣었다면 <b>사진·영상 포함 zip 받기</b>로 받아서 압축을 풀고, 나온 파일과 media 폴더를 GitHub 에 끌어다 올리세요.</p>
  </div>
  <div class="prev"><iframe id="pv" title="미리보기"></iframe></div>
</div>

<script src="config.js"></script>
<script>
(function(){
  var ORIGINAL = JSON.parse(JSON.stringify(window.PORTFOLIO));
  var cfg = JSON.parse(JSON.stringify(ORIGINAL));
  var KEY = 'portfolio-editor-draft';
  try { var saved = localStorage.getItem(KEY); if (saved) cfg = JSON.parse(saved); } catch(e){}
  var pv = document.getElementById('pv'), form = document.getElementById('form'), msg = document.getElementById('msg');
  var html = null, timer = null, lastScroll = 0;

  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    for (var k in (attrs||{})) { if (k==='text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
    (kids||[]).forEach(function(c){ n.appendChild(c); });
    return n;
  }
  function field(label, get, set, opts){
    opts = opts || {};
    var wrap = el('div');
    wrap.appendChild(el('label', {text: label}));
    var inp = opts.multi ? el('textarea') : el('input', {type: opts.number ? 'number' : 'text'});
    if (opts.number) { inp.min = opts.min || 0; if (opts.max) inp.max = opts.max; }
    inp.value = get();
    inp.addEventListener('input', function(){ set(inp.value); changed(); });
    wrap.appendChild(inp);
    return wrap;
  }
  function check(label, get, set){
    var l = el('label', {'class':'chk'});
    var c = el('input', {type:'checkbox'}); c.checked = !!get();
    c.addEventListener('change', function(){ set(c.checked); changed(); });
    l.appendChild(c); l.appendChild(document.createTextNode(' ' + label));
    return l;
  }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function refresh(){ var y = form.scrollTop; build(); form.scrollTop = y; changed(); }
  function extOf(f){ var e = (f.name.split('.').pop() || '').toLowerCase(); if (e === 'jpeg') e = 'jpg'; return e || (f.type.indexOf('video')===0 ? 'mp4' : 'jpg'); }
  function isNoticeSec(s){ return (s.images !== undefined) || /notice/.test(s.id || ''); }
  function slotCount(s){ return isNoticeSec(s) ? (s.images || []).length : (parseInt(s.count, 10) || 0); }
  function folderOf(s){ return (s.folder || ('media/' + (s.id || 'section'))).replace(/\/$/, ''); }
  function pathFor(s, j, f){ return folderOf(s) + '/' + pad(j+1) + '.' + extOf(f); }
  function defPath(s, j){ return folderOf(s) + '/' + pad(j+1) + '.' + (s.ext || (s.mediaType === 'video' ? 'mp4' : 'jpg')); }
  function slotsOf(s){
    var n = slotCount(s); s._slots = s._slots || [];
    while (s._slots.length < n) s._slots.push(null);
    if (s._slots.length > n) { s._slots.slice(n).forEach(function(x){ if (x) URL.revokeObjectURL(x.url); }); s._slots.length = n; }
    return s._slots;
  }
  function setSlot(s, j, file){
    var mt = s.mediaType || 'any', notice = isNoticeSec(s);
    var isV = file.type.indexOf('video') === 0, isI = file.type.indexOf('image') === 0;
    if (!(isV || isI) || (mt === 'image' && !isI) || (mt === 'video' && !isV) || (notice && !isI)) {
      msg.textContent = '이 칸에는 ' + (notice || mt === 'image' ? '사진(이미지)' : (mt === 'video' ? 'MP4 영상' : '사진·영상')) + ' 파일만 넣을 수 있어요.'; return;
    }
    var sl = slotsOf(s); if (sl[j]) URL.revokeObjectURL(sl[j].url);
    sl[j] = {file: file, url: URL.createObjectURL(file)};
    refresh();
  }
  function resize(s, delta){
    if (isNoticeSec(s)) {
      var im = s.images = s.images || [], n = im.length + delta;
      if (n < 1 || n > 3) return;
      if (delta > 0) im.push(defPath(s, im.length)); else im.pop();
    } else {
      var n2 = (parseInt(s.count, 10) || 0) + delta;
      if (n2 < 1 || n2 > 30) return;
      s.count = n2; if (s.items && s.items.length > n2) s.items.length = n2;
    }
    refresh();
  }
  function materialize(exp){
    var c = JSON.parse(JSON.stringify(cfg, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }));
    (cfg.sections || []).forEach(function(s, i){
      var sl = s._slots; if (!sl || !sl.some(Boolean)) return;
      var d = c.sections[i];
      if (isNoticeSec(s)) {
        d.images = (s.images || []).map(function(p, j){ var x = sl[j]; return x ? (exp ? pathFor(s, j, x.file) : x.url) : p; });
        return;
      }
      d.folder = folderOf(s);
      var n = slotCount(s); d.items = [];
      for (var j = 0; j < n; j++) {
        var o = {}, src = (s.items || [])[j] || {}, x = sl[j];
        for (var k in src) o[k] = src[k];
        if (x) { o.src = exp ? pathFor(s, j, x.file) : x.url; o.type = x.file.type.indexOf('video') === 0 ? 'video' : 'image'; }
        d.items.push(o);
      }
    });
    return c;
  }

  var toLines = function(s){ return String(s||'').replace(/\n/g,'\\n'); };

  function build(){
    Array.prototype.slice.call(form.querySelectorAll('fieldset')).forEach(function(n){ n.remove(); });
    var site = cfg.site = cfg.site || {};
    var fs = el('fieldset', {}, [el('legend', {text:'맨 위 · 스튜디오 이름'})]);
    fs.appendChild(field('스튜디오 이름', function(){return site.title||'';}, function(v){site.title=v;}));
    fs.appendChild(field('한 줄 설명', function(){return site.subtitle||'';}, function(v){site.subtitle=v;}));
    if (site.cta) {
      var r = el('div', {'class':'row'});
      r.appendChild(field('버튼 글자', function(){return site.cta.label||'';}, function(v){site.cta.label=v;}));
      r.appendChild(field('버튼 주소', function(){return site.cta.url||'';}, function(v){site.cta.url=v;}));
      fs.appendChild(r);
    }
    form.appendChild(fs);

    if (cfg.intro) {
      var it = cfg.intro;
      var f2 = el('fieldset', {}, [el('legend', {text:'소개 칸'})]);
      f2.appendChild(field('작은 글씨 (제목 위)', function(){return it.eyebrow||'';}, function(v){it.eyebrow=v;}));
      f2.appendChild(field('소개 제목 (줄바꿈은 엔터)', function(){return it.title||'';}, function(v){it.title=v;}, {multi:true}));
      f2.appendChild(field('부가 설명 (줄바꿈은 엔터)', function(){return it.desc||'';}, function(v){it.desc=v;}, {multi:true}));
      f2.appendChild(field('태그 (쉼표로 구분)', function(){return (it.tags||[]).join(', ');}, function(v){it.tags = v.split(',').map(function(s){return s.trim();}).filter(Boolean);}));
      form.appendChild(f2);
    }

    (cfg.sections||[]).forEach(function(s){
      var f = el('fieldset', {}, [el('legend', {text:'섹션 · ' + (s.title||s.id)})]);
      var r = el('div', {'class':'row'});
      r.appendChild(field('섹션 이름', function(){return s.title||'';}, function(v){s.title=v;}));

      f.appendChild(r);
      f.appendChild(field('설명', function(){return s.subtitle||'';}, function(v){s.subtitle=v;}));
      f.appendChild(check('처음부터 펼쳐두기', function(){return s.open;}, function(v){s.open=v;}));
      /* 사진·영상 칸: 칸을 눌러서 한 장씩 넣기 */
      var isNotice = isNoticeSec(s), mt = s.mediaType || 'any';
      var accept = isNotice || mt === 'image' ? 'image/*' : (mt === 'video' ? 'video/mp4,video/webm,video/quicktime' : 'image/*,video/mp4,video/webm,video/quicktime');
      var kindTxt = isNotice ? '이미지(1~3칸)' : (mt === 'image' ? '사진' : (mt === 'video' ? 'MP4 영상' : '사진·GIF·MP4'));
      var n = slotCount(s), sl = slotsOf(s);
      f.appendChild(el('label', {text: kindTxt + ' · 칸을 눌러서 한 장씩 넣으세요'}));
      var grid = el('div', {'class':'slots'});
      for (var j = 0; j < n; j++) (function(j){
        var x = sl[j], w = el('div', {'class':'slot'});
        var lab = el('label', {'class':'slotb' + (x ? ' filled' : ''), title: x ? '눌러서 다른 파일로 바꾸기' : '눌러서 파일 넣기'});
        if (x) lab.appendChild(x.file.type.indexOf('video') === 0 ? el('video', {src:x.url, muted:'', preload:'metadata'}) : el('img', {src:x.url, alt:''}));
        else if (!(s.mediaType === 'video')) {
          var im = el('img', {src: defPath(s, j), alt:''});
          im.onload = function(){ lab.className += ' has'; };
          im.onerror = function(){ im.remove(); };
          lab.appendChild(im);
        }
        lab.appendChild(el('span', {'class':'no', text: String(j+1)}));
        lab.appendChild(el('span', {'class':'plus', text: x ? '' : '＋'}));
        var fi = el('input', {type:'file', accept: accept});
        fi.addEventListener('change', function(){ if (fi.files && fi.files[0]) setSlot(s, j, fi.files[0]); fi.value = ''; });
        lab.appendChild(fi); w.appendChild(lab);
        if (x) { var rm = el('button', {type:'button', 'class':'rm', title:'이 칸 파일 빼기', text:'✕'}); rm.onclick = function(){ URL.revokeObjectURL(x.url); sl[j] = null; refresh(); }; w.appendChild(rm); }
        grid.appendChild(w);
      })(j);
      f.appendChild(grid);
      var ctl = el('div', {'class':'row', 'style':'margin-top:8px;gap:8px'});
      var bAdd = el('button', {type:'button', 'class':'sm', text:'＋ 칸 추가'}); bAdd.onclick = function(){ resize(s, 1); };
      var bDel = el('button', {type:'button', 'class':'sm', text:'－ 마지막 칸 빼기'}); bDel.onclick = function(){ resize(s, -1); };
      ctl.appendChild(bAdd); ctl.appendChild(bDel); f.appendChild(ctl);
      f.appendChild(el('p', {'class':'hint', 'style':'margin:8px 0 0', text:'회색 칸에 이미 GitHub 에 올라간 사진이 있으면 그 사진이 보여요. 새로 넣은 파일은 zip 을 받을 때 media 폴더에 칸 번호(01, 02…) 이름으로 저장돼요.'}));

      var nCards = isNotice ? 0 : n;
      if (!isNotice && nCards) {
        if (!s.items) s.items = [];
        while (s.items.length < nCards) s.items.push({});
        var d = el('details', {}, [el('summary', {text:'카드 글자 (' + nCards + '개)'})]);
        s.items.slice(0, nCards).forEach(function(item, i){
          var box = el('div', {'class':'item'});
          box.appendChild(field((i+1) + '번 제목', function(){return item.title||'';}, function(v){item.title=v;}));
          box.appendChild(field((i+1) + '번 설명', function(){return item.desc||'';}, function(v){item.desc=v;}));
          if (('price' in item) || /adopt/.test(s.id||'')) box.appendChild(field((i+1) + '번 가격', function(){return item.price||'';}, function(v){item.price=v;}));
          d.appendChild(box);
        });
        f.appendChild(d);
      }
      if (s.notes) f.appendChild(field('주의 문구 (한 줄에 하나)', function(){return s.notes.join('\n');}, function(v){s.notes=v.split('\n').filter(function(x){return x.trim();});}, {multi:true}));
      form.appendChild(f);
    });
  }

  function configText(){
    return '/* 미리보기 편집기로 만든 설정 파일입니다. 이 파일 내용을 GitHub 의 config.js 에 통째로 붙여넣으세요. */\n' +
      'window.PORTFOLIO = ' + JSON.stringify(materialize(true), null, 2) + ';\n';
  }

  function render(){
    if (!html) return;
    var inline = '<script>window.PORTFOLIO = ' + JSON.stringify(materialize(false)).replace(/</g,'\\u003c') + ';<\/script>';
    var base = '<base href="' + location.href.replace(/[^\/]*$/, '') + '">';
    var out = html.replace(/<script src="config\.js"><\/script>/, inline).replace(/<head>/i, '<head>' + base);
    try { lastScroll = pv.contentWindow.scrollY || 0; } catch(e){}
    pv.onload = function(){ try { pv.contentWindow.scrollTo(0, lastScroll); } catch(e){} };
    pv.srcdoc = out;
  }
  function changed(){
    try { localStorage.setItem(KEY, JSON.stringify(cfg, function(k, v){ return k.charAt(0) === '_' ? undefined : v; })); } catch(e){}
    msg.textContent = '고치는 중… (아직 저장 전)';
    clearTimeout(timer); timer = setTimeout(render, 350);
  }

  document.getElementById('copy').onclick = function(){
    var t = configText();
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ msg.textContent = '복사됐어요! GitHub config.js 에 붙여넣으세요.'; }, function(){
      var ta = el('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); msg.textContent = '복사됐어요! GitHub config.js 에 붙여넣으세요.';
    });
  };
  document.getElementById('dl').onclick = function(){
    var a = el('a', {href: URL.createObjectURL(new Blob([configText()], {type:'text/javascript'})), download:'config.js'});
    document.body.appendChild(a); a.click(); a.remove();
  };
  function crc32(u8){
    var t = crc32.t;
    if (!t) { t = crc32.t = []; for (var n = 0; n < 256; n++) { var c0 = n; for (var k = 0; k < 8; k++) c0 = (c0 & 1) ? (0xEDB88320 ^ (c0 >>> 1)) : (c0 >>> 1); t[n] = c0 >>> 0; } }
    var c = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) c = t[(c ^ u8[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files){
    var enc = new TextEncoder(), parts = [], cd = [], off = 0, cdSize = 0;
    files.forEach(function(f){
      var nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(12,0x21,true);
      h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,nm.length,true);
      parts.push(h.buffer, nm, f.data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(14,0x21,true);
      c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
      cd.push(c.buffer, nm); cdSize += 46 + nm.length; off += 30 + nm.length + sz;
    });
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
    return new Blob(parts.concat(cd, [e.buffer]), {type:'application/zip'});
  }
  document.getElementById('zip').onclick = function(){
    msg.textContent = 'zip 만드는 중…';
    var enc = new TextEncoder(), c = materialize(true), files = [{name:'config.js', data: enc.encode(configText())}], jobs = [];
    (cfg.sections || []).forEach(function(s){ (s._slots || []).forEach(function(m, j){ if (m) jobs.push(m.file.arrayBuffer().then(function(buf){ files.push({name: pathFor(s, j, m.file), data: new Uint8Array(buf)}); })); }); });
    Promise.all(jobs).then(function(){
      var a = el('a', {href: URL.createObjectURL(makeZip(files)), download:'portfolio-update.zip'});
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = 'zip 을 받았어요. 압축을 풀고 안의 파일들을 GitHub 에 올리세요.';
    });
  };
  document.getElementById('reset').onclick = function(){
    if (!confirm('지금까지 고친 내용을 지우고 처음 상태로 되돌릴까요?')) return;
    (cfg.sections||[]).forEach(function(s){ (s._slots||[]).forEach(function(m){ if (m) URL.revokeObjectURL(m.url); }); });
    cfg = JSON.parse(JSON.stringify(ORIGINAL));
    try { localStorage.removeItem(KEY); } catch(e){}
    build(); render(); msg.textContent = '처음 상태로 되돌렸어요.';
  };

  build();
  fetch('index.html').then(function(r){ return r.text(); }).then(function(t){ html = t; render(); }).catch(function(){
    var e = document.getElementById('err'); e.style.display = 'block';
    e.textContent = '미리보기를 불러오지 못했어요. 파일을 더블클릭해서 여는 대신, GitHub Pages 주소(…github.io/portfolio/editor.html)로 열어주세요.';
  });
})();
</script>
