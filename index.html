:root{
  /* 색을 바꾸려면 아래 값만 수정하세요 */
  --bg:#FFFFFF;          /* 페이지 배경: 흰색 */
  --bg-2:#FCF4F5;        /* 사진 칸 뒤 연한 버건디 핑크 */
  --panel:#FFFFFF;
  --panel-2:#FBF0F2;
  --ivory:#3B2630;       /* 글자: 부드러운 짙은 와인색 */
  --paper:#FCF3F4;       /* 의뢰 안내 카드: 연한 로제 */
  --paper-ink:#3A1F28;
  --paper-muted:#75595F;
  --muted:#7A5E66;
  --gold:#8E2B48;        /* 포인트 글자색: 진한 버건디 */
  --gold-deep:#C9707F;
  --lav:#F2C9D5;         /* 연한 버건디 핑크 */
  --edge:#EBC6D0;        /* 테두리 */
  --edge-hi:#D08A9F;     /* 마우스를 올렸을 때 테두리 */
  --line:rgba(200,130,150,.35);
  --serif:"Aggravo","Noto Serif KR","Noto Serif CJK KR",serif;
  --sans:"Aggravo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --stellar:"Stellar Serif","Noto Serif KR",serif;
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--bg);color:var(--ivory);font-family:var(--sans);font-size:16px;font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:clip;
  background-image:radial-gradient(900px 520px at 90% -5%,rgba(240,190,205,.40),transparent 65%),radial-gradient(700px 480px at -5% 30%,rgba(252,222,214,.55),transparent 70%)}
img,video{max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #7A2A45;outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}

.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 28px}
section[id]{scroll-margin-top:84px}

/* ---- 상단 메뉴 ---- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;min-height:68px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;text-decoration:none;line-height:1.1;margin-right:auto}
.logo b{font-family:var(--stellar);font-weight:700;font-size:26px;letter-spacing:.02em}
.logo small{margin-top:3px;font-size:11px;letter-spacing:.22em;color:var(--gold)}
#nav{display:flex;gap:4px;margin:0;padding:0;list-style:none}
#nav a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;color:var(--muted)}
#nav a:hover{color:var(--ivory);background:rgba(240,190,205,.12)}
@media (max-width:760px){
  .bar{padding:10px 0;gap:10px}
  .bar nav{order:3;width:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
  .bar nav::-webkit-scrollbar{display:none}
  #nav{width:max-content;padding-bottom:2px}
  #nav::-webkit-scrollbar{display:none}
  #nav a{white-space:nowrap}
  .wrap{padding:0 20px}
}

/* ---- 버튼 ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:12px;border:1px solid #FFFFFF;
  background:linear-gradient(135deg,#F8D6CC,#E9A9BC);color:var(--paper-ink);font-weight:700;font-size:17px;text-decoration:none;text-align:center;
  box-shadow:0 0 0 3px rgba(240,185,200,.35),0 10px 24px rgba(150,50,80,.22);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:22px;height:22px;flex:none}
.btn.sm{min-height:42px;padding:0 18px;font-size:14px;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid var(--edge-hi);box-shadow:none}
.btn.ghost:hover{background:rgba(240,185,200,.28)}
@media (max-width:760px){.btn.sm{display:none}}

/* ---- 첫 화면 ---- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:56px;align-items:center;padding-top:64px;padding-bottom:72px}
.hero .eyebrow{font-size:13px;letter-spacing:.2em;color:var(--gold);margin-bottom:18px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,5.4vw,66px);line-height:1.2;letter-spacing:-.01em;white-space:pre-line;word-break:keep-all}
.hero .lead{margin-top:24px;max-width:30em;color:var(--muted);font-size:18px;line-height:1.85;white-space:pre-line;word-break:keep-all;border-left:2px solid var(--gold);padding-left:18px}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 0;padding:0;list-style:none}
.tags li{border:1px solid var(--edge);border-radius:999px;padding:4px 18px;font-size:15px;font-weight:500;color:var(--ivory);background:rgba(240,185,200,.28)}
.hero .btn{margin-top:34px}
.art{position:relative;margin:0}
.art::before{content:"";position:absolute;inset:-12px -12px 12px 12px;border:1px solid var(--line);border-radius:22px;pointer-events:none}
.art button{position:relative;display:block;width:100%;padding:0;border:1px solid var(--edge-hi);border-radius:20px;overflow:hidden;background:var(--panel);aspect-ratio:4/5;box-shadow:0 24px 60px rgba(138,44,71,.30)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.art figcaption{margin-top:14px;text-align:right;font-size:13px;color:var(--muted)}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:36px;padding-top:28px;padding-bottom:48px}
  .art{order:-1;max-width:520px;width:calc(100% - 12px);margin:0 auto}
  .art::before{inset:-8px -8px 8px 8px}
  .art button{aspect-ratio:1/1}
}

/* ---- 강점 띠 ---- */
.strengths{padding-bottom:72px}
.band{--line:rgba(138,44,71,.25);color:var(--ivory);border:1px solid var(--edge);border-radius:18px;padding:32px 30px 34px;background:linear-gradient(135deg,#FBE3E8,#FDEEE6 60%,#F6D8DF);box-shadow:0 12px 30px rgba(138,44,71,.16)}
.band h2{font-family:var(--serif);font-weight:700;text-align:center;font-size:clamp(22px,3vw,30px);word-break:keep-all}
.band ul{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.band li{padding:4px 26px;text-align:center}
.band li+li{border-left:1px solid var(--line)}
.band svg{width:40px;height:40px;color:var(--gold);margin:0 auto 10px;display:block}
.band h3{font-size:17px;font-weight:700;word-break:keep-all}
.band li p{margin-top:6px;color:var(--muted);font-size:14.5px;line-height:1.65;word-break:keep-all}
@media (max-width:760px){
  .band ul{grid-template-columns:1fr;gap:22px}
  .band li{padding:0}
  .band li+li{border-left:0;border-top:1px solid var(--line);padding-top:22px}
}

/* ---- 공통 섹션 머리 ---- */
.sec{padding-top:72px;padding-bottom:80px;border-top:1px solid var(--line)}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head h2{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.2vw,44px);line-height:1.25;word-break:keep-all}
.sec-head p{margin-top:12px;color:var(--muted);word-break:keep-all}

/* ---- 포트폴리오 ---- */
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:34px}
.tab{min-height:46px;padding:0 24px;border-radius:999px;border:1px solid var(--edge-hi);background:transparent;color:var(--ivory);font-size:16px;font-weight:500}
.tab:hover{background:rgba(240,185,200,.28)}
.tab[aria-selected="true"]{background:var(--lav);border-color:var(--lav);color:var(--paper-ink);font-weight:700}
.tab em{font-style:normal;margin-left:6px;opacity:.8}
.sub-head{margin:6px 0 18px}
.sub-head h3{font-family:var(--serif);font-size:22px}
.sub-head p{color:var(--muted);font-size:15px;margin-top:2px}
.sub-head+.grid,.sub-head+.compare{margin-top:0}
.grid+.sub-head,.compare+.sub-head{margin-top:44px}
.cmp-label{font-size:15px;font-weight:700;color:var(--gold);margin:0 0 14px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:22px}
@media (max-width:900px){.grid{grid-template-columns:repeat(min(var(--cols,3),2),minmax(0,1fr))}}
@media (max-width:560px){.grid,.compare{grid-template-columns:minmax(0,1fr)}}
.card{min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-4px);border-color:var(--edge-hi)}
.media{position:relative;display:block;width:100%;padding:0;border:0;overflow:hidden;background:var(--bg-2);aspect-ratio:var(--ratio,1/1)}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:var(--fit,cover);transition:transform .5s ease}
.card:hover .media img,.card:hover .media video{transform:scale(1.03)}
.badge{position:absolute;left:10px;top:10px;z-index:1;background:rgba(255,255,255,.92);color:#7A1F3D;border:1px solid var(--line);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.meta{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.meta h3{font-size:17px;font-weight:700}
.meta p{color:var(--muted);font-size:14.5px;line-height:1.6}
.meta .price{color:var(--gold);font-weight:700}
.meta a{color:#8A2C47;font-weight:700;font-size:14px;margin-top:4px}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;color:var(--muted);font-size:13px;white-space:pre-line}

/* ---- 의뢰 안내 ---- */
.guide .paper{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:30px 32px 34px;margin-bottom:26px;border:1px solid #F0D9DF;box-shadow:0 10px 30px rgba(138,44,71,.14)}
.paper h3.pt{font-family:var(--serif);font-weight:700;font-size:22px;display:flex;align-items:center;gap:12px;margin-bottom:24px}
.paper h3.pt::after{content:"";flex:1;height:1px;background:rgba(58,31,40,.22)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.steps li{position:relative;text-align:center;padding:0 10px}
.steps li+li::before{content:"";position:absolute;left:-18%;top:36px;width:36%;border-top:2px dotted rgba(138,44,71,.4)}
.ico{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#F6D9E1;color:#7A1F3D;border:3px solid #FFFFFF}
.ico svg{width:34px;height:34px}
.steps li:nth-child(2) .ico{background:#F8D5DC}.steps li:nth-child(3) .ico{background:#FBE3D6}.steps li:nth-child(4) .ico{background:#F7E4C8}
.steps b{display:inline-block;min-width:104px;padding:3px 18px;border-radius:999px;background:#F1C4D0;color:#4A1A2A;font-size:15px}
.steps p{margin-top:10px;font-size:14.5px;color:var(--paper-muted);line-height:1.6;word-break:keep-all}
@media (max-width:760px){
  .steps{grid-template-columns:1fr;gap:20px}
  .steps li{display:grid;grid-template-columns:72px minmax(0,1fr);column-gap:16px;text-align:left;align-items:center;padding:0}
  .steps li+li::before{display:none}
  .steps .ico{grid-row:1/3;margin:0}
  .steps b{justify-self:start}
  .steps p{margin-top:4px}
  .guide .paper{padding:24px 20px 26px}
}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.svc{display:flex;flex-direction:column;background:#FFFFFF;border:1px solid rgba(138,44,71,.22);border-radius:14px;overflow:hidden;text-align:left;padding:0}
.svc .pic{position:relative;aspect-ratio:16/10;background:#EBD3D9;overflow:hidden}
.svc .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.svc .tx{padding:14px 18px 18px}
.svc h4{margin:0;font-family:var(--serif);font-size:21px}
.svc p{margin-top:4px;font-size:14.5px;color:var(--paper-muted);line-height:1.6;word-break:keep-all}
.svc:hover{border-color:#D08A9F}
@media (max-width:760px){.services{grid-template-columns:1fr}}
.infos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.info{background:#FFFFFF;border:1px solid rgba(138,44,71,.22);border-radius:14px;padding:16px 16px 18px;text-align:center}
.info .lab{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--paper-muted);font-weight:500}
.info .lab svg{width:20px;height:20px;color:#8A2C47}
.info .val{margin-top:8px;font-family:var(--serif);font-weight:700;font-size:24px;color:#8A2C47;word-break:keep-all}
.info .val.small{font-size:17px;line-height:1.5}
.info .lab span{word-break:keep-all}
@media (max-width:900px){.infos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.info .lab svg{display:none}.info .lab{font-size:13px}.info .val{font-size:21px}.info .val.small{font-size:15px}}
.two{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:26px;align-items:start}
.two .paper{margin-bottom:0}
@media (max-width:900px){.two{grid-template-columns:1fr;gap:0}.two .paper{margin-bottom:26px}}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:500}
.checks svg{flex:none;width:24px;height:24px;margin-top:2px;padding:3px;border-radius:6px;background:#F8E1E8;color:#8A2C47}
.notices{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
.notices li{break-inside:avoid;display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;line-height:1.55;border-bottom:1px solid rgba(58,31,40,.12);word-break:keep-all}
.notices svg{flex:none;width:18px;height:18px;margin-top:3px;color:#8A2C47}
@media (max-width:640px){.notices{columns:1}}
.paper .lead2{font-size:14.5px;color:var(--paper-muted);margin:-8px 0 16px;word-break:keep-all}
.btn.dark{margin-top:20px;min-height:48px;font-size:15px;background:#F1C4D0;color:#4A1A2A;border-color:#F1C4D0;box-shadow:none}

/* ---- 견적 ---- */
.est{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:26px;align-items:start}
@media (max-width:900px){.est{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 26px 28px}
.fs{border:0;margin:0 0 26px;padding:0;min-width:0}
.fs:last-child{margin-bottom:0}
.fs legend{padding:0;margin-bottom:12px;font-family:var(--serif);font-weight:700;font-size:19px;color:var(--gold)}
.fs .hint{font-family:var(--sans);font-weight:400;font-size:13.5px;color:var(--muted);margin-left:8px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative;display:inline-flex;flex-direction:column;justify-content:center;min-height:48px;padding:8px 20px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);font-weight:500;user-select:none}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.opt span{pointer-events:none}
.opt small{pointer-events:none;color:var(--muted);font-size:12.5px;font-weight:400;line-height:1.4}
.opt:hover{border-color:var(--edge-hi)}
.opt.on{background:var(--lav);border-color:var(--lav);color:var(--paper-ink);font-weight:700}
.opt.on small{color:#5A3A44}
.opt:has(input:focus-visible){outline:3px solid var(--lav);outline-offset:3px}
.sum{--line:rgba(138,44,71,.25);color:var(--ivory);position:sticky;top:86px;background:linear-gradient(160deg,#FBEAEC,#FDEFE9);border:1px solid var(--edge);border-radius:18px;padding:26px 26px 28px}
@media (max-width:900px){.sum{position:static}}
.sum h3{font-family:var(--serif);font-size:21px;margin-bottom:14px}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.lines li span:first-child{color:var(--muted);flex:none}
.lines li span:last-child{text-align:right;font-weight:500;word-break:keep-all}
.lines .amt{color:var(--gold);font-weight:700;white-space:nowrap}
.total{margin-top:18px;padding:16px 18px;border-radius:12px;background:#FFFFFF;border:1px solid var(--line)}
.total .k{font-size:14px;color:var(--muted)}
.total .v{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--gold);line-height:1.35;margin-top:2px;word-break:keep-all}
.total .v.txt{font-size:18px;color:var(--ivory)}
.total .sub{margin-top:4px;font-size:13.5px;color:var(--muted)}
.sum .btn{width:100%;margin-top:18px}
.sum .btn.ghost{margin-top:10px;min-height:48px;font-size:15px}
.notes{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:6px;font-size:13.5px;color:var(--muted);line-height:1.6}
.notes li{padding-left:14px;position:relative;word-break:keep-all}
.notes li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;max-width:calc(100% - 40px);background:var(--lav);color:var(--paper-ink);font-weight:700;font-size:15px;padding:12px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- 후기 ---- */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
.rev{margin:0;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:26px 26px 22px;border:1px solid #F0D9DF;position:relative}
.rev::before{content:"“";position:absolute;left:20px;top:2px;font-family:var(--serif);font-size:64px;line-height:1;color:#D9A3B3}
.rev blockquote{margin:0;padding-top:26px;font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.7;word-break:keep-all;white-space:pre-line}
.rev figcaption{margin-top:14px;font-size:14px;color:var(--paper-muted)}
.rev img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:16px}

/* ---- 마지막 문의 ---- */
.contact{padding:0 0 72px}
.cta-box{--line:rgba(138,44,71,.25);color:var(--ivory);text-align:center;border:1px solid var(--edge);border-radius:22px;padding:54px 28px 56px;background:linear-gradient(135deg,#FBE3E8,#FDEEE6 55%,#F6D8DF);box-shadow:0 12px 30px rgba(138,44,71,.16)}
.cta-box h2{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4vw,40px);word-break:keep-all}
.cta-box p{margin-top:10px;color:var(--muted)}
.cta-box .btn{margin-top:28px}
footer{padding:26px 0 44px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
footer a{color:var(--gold)}

/* ---- 전체화면 보기 ---- */
dialog.lb{border:0;padding:0;margin:0;background:transparent;width:100vw;height:100vh;max-width:100vw;max-height:100vh;color:#fff}
dialog.lb::backdrop{background:rgba(8,5,12,.94)}
.lb-wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 72px 16px;gap:12px;touch-action:pan-y}
.lb-body{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.lb-body img,.lb-body video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#000}
.lb-cap{text-align:center;font-size:14px;min-height:22px}
.lb-close{position:absolute;top:10px;right:10px;min-width:48px;min-height:48px;border-radius:999px;border:0;background:#F4ECDF;color:#111;font-size:24px;z-index:3}
.lb-count{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;background:rgba(255,255,255,.14);padding:3px 12px;border-radius:999px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;border:0;background:#F4ECDF;color:#1b1a17;display:grid;place-items:center;z-index:2}
.nav svg{width:22px;height:22px}
.lb .nav.prev{left:12px}.lb .nav.next{right:12px}
@media (max-width:600px){.lb-wrap{padding:60px 8px 12px}.lb .nav{top:auto;bottom:16px;transform:none}}

/* ---- 섹션 위 작은 영문 라벨 (참고 페이지의 장점) ---- */
.sec-head[data-eb]::before{content:attr(data-eb);display:block;margin-bottom:10px;font-size:12.5px;font-weight:700;letter-spacing:.2em;color:var(--gold)}
/* 안내 상자 (포트폴리오 설명 · 견적 안내) */
.sub-head p{display:block;margin-top:10px;padding:12px 16px;border-radius:12px;border:1px solid #EBC3CC;border-left:4px solid #C5576F;background:#FCEEEE;color:#6B2E3E;font-size:14.5px;line-height:1.6}
/* 진행 순서: 번호 + 화살표 */
.steps{counter-reset:st}
.steps li{counter-increment:st}
.steps li::after{content:counter(st);position:absolute;top:-2px;left:calc(50% + 18px);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#8E2B48;color:#fff;font-size:13px;font-weight:700;border:2px solid #fff}
.steps li:nth-child(2)::after{background:#B5465F}.steps li:nth-child(3)::after{background:#C8695E}.steps li:nth-child(4)::after{background:#A86A3A}
.steps li+li::before{content:"›";border:0;top:22px;left:-12%;width:24%;text-align:center;font-size:30px;line-height:1;color:#D08A9F}
@media (max-width:760px){.steps li::after{left:52px;top:-4px}.steps li+li::before{display:none}}
/* 확인사항: 번호 표시 */
.notices{counter-reset:nt}
.notices li{counter-increment:nt}
.notices li svg{display:none}
.notices li::before{content:counter(nt);flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;display:grid;place-items:center;background:#F8E1E8;color:#7A1F3D;font-size:12.5px;font-weight:700}
/* 신청 정보 입력 */
.est-left{display:grid;gap:22px;min-width:0}
.bt{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:20px;margin-bottom:6px}
.bt .no{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--lav);color:var(--paper-ink);font-family:var(--sans);font-size:14px;font-weight:700}
.bt-sub{color:var(--muted);font-size:14px;margin:0 0 18px;word-break:keep-all}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;margin-bottom:7px;font-size:15px;font-weight:700}
.fld input,.fld textarea{width:100%;font:inherit;font-size:15.5px;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);background:#FEF8F8;color:var(--ivory)}
.fld textarea{min-height:92px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:3px solid var(--lav);outline-offset:1px;border-color:var(--edge-hi)}
.fld input::placeholder,.fld textarea::placeholder{color:#B9959E}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.5;cursor:pointer;word-break:keep-all}
.agree input{flex:none;width:20px;height:20px;margin-top:1px;accent-color:#8E2B48}
.sum .btn[aria-disabled="true"]{opacity:.45;pointer-events:none;filter:saturate(.6)}
.sum .btn.ghost[disabled]{opacity:.45;cursor:not-allowed}
.sum .btn.reset{border-color:transparent;min-height:42px;font-size:14px;color:var(--muted)}
/* 자주 묻는 질문 */
.faq{max-width:820px;margin:0 auto;display:grid;gap:12px}
.faq details{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:0 20px}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 0;font-weight:700;font-size:16px;word-break:keep-all}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{font-style:normal;font-family:var(--serif);font-size:22px;color:#D9A3B3}
.faq summary::after{content:"+";margin-left:auto;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#F9E7EC;color:#8A2C47;flex:none}
.faq details[open] summary::after{content:"–"}
.faq .ans{padding:0 0 18px 40px;color:var(--muted);line-height:1.75;white-space:pre-line;word-break:keep-all}
/* 빠른 메뉴 (넓은 화면) / 맨 위로 버튼 */
#quick{display:none}
#toTop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#F8D6CC,#E9A9BC);color:#4A1A2A;font-weight:700;font-size:20px;text-decoration:none;box-shadow:0 8px 20px rgba(138,44,71,.3);opacity:0;pointer-events:none;transition:opacity .25s}
#toTop.show{opacity:1;pointer-events:auto}
@media (min-width:900px){
  #quick{display:block;position:fixed;right:max(18px,calc((100vw - 1200px)/2 - 150px));top:50%;transform:translateY(-50%);z-index:30;width:128px;text-align:center}
  #quick .q-t{font-weight:700;font-size:15px;letter-spacing:.12em;color:#7A1F3D;background:linear-gradient(135deg,#F8D6CC,#E9A9BC);border-radius:999px;padding:8px 0 6px;line-height:1.2}
  #quick .q-t small{display:block;font-size:9.5px;letter-spacing:.14em;font-weight:500;opacity:.8}
  #quick ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:7px}
  #quick li a{display:block;padding:8px 6px;border-radius:12px;background:#fff;border:1px solid var(--edge);border-left:4px solid var(--edge-hi);font-size:13.5px;font-weight:700;color:var(--ivory);text-decoration:none;box-shadow:0 4px 10px rgba(138,44,71,.1)}
  #quick li a:hover,#quick li a.on{background:var(--lav);border-color:var(--lav);border-left-color:#8E2B48}
  #quick .q-top{display:inline-block;padding:5px 14px;border-radius:999px;background:#fff;border:1px solid var(--edge);font-size:12px;font-weight:700;color:#8A2C47;text-decoration:none}
  #toTop{display:none}
}
@media (min-width:900px) and (max-width:1359px){
  #quick{width:92px;right:28px;padding:8px 7px;border-radius:16px;background:rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(138,44,71,.16)}
  #quick .q-t{font-size:13px;padding:7px 0 5px}
  #quick li a{font-size:12px;padding:6px 3px}
}
body.tall:not(.vp) #quick{display:none!important}
body.tall.vp #quick{position:absolute;transform:translateY(-50%)}
dialog.lb.abs{position:fixed;inset:auto;left:0;width:100vw;margin:0}

/* ---- 버건디 그라데이션 포인트 ---- */
.sec-head[data-eb]::before{background:linear-gradient(90deg,#8E2B48,#C8695E);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tab[aria-selected="true"]{background:linear-gradient(135deg,#F8D6CC,#EBA9BC);border-color:#EBA9BC}
.opt.on{background:linear-gradient(135deg,#F8D6CC,#EBA9BC);border-color:#EBA9BC}
.btn.dark,.steps b{background:linear-gradient(135deg,#F8DDD3,#F1C4D0)}
.bt .no{background:linear-gradient(135deg,#F8D6CC,#E9A9BC)}
.sub-head p{background:linear-gradient(90deg,#FCEEEE,#FEF6F1)}
.total .v{background:linear-gradient(90deg,#8E2B48,#C8695E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.total .v.txt{background:none;-webkit-text-fill-color:currentColor}
.band h3,.paper h3.pt{color:#5A1A2E}

/* ---- 의뢰 전 확인사항 (사진 문구 그대로) ---- */
.ntc{border:1px solid var(--edge);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(138,44,71,.12);scroll-margin-top:90px}
.ntc header{padding:30px 34px 28px;background:linear-gradient(135deg,#F8DDD3,#F1C4D0 60%,#E9A9BC);color:#4A1A2A}
.ntc .en{font-size:13px;font-weight:700;letter-spacing:.22em}
.ntc h3{margin:8px 0 10px;font-family:var(--serif);font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1.3;word-break:keep-all}
.ntc .sub{font-size:15px;opacity:.85}
.ntc ol{list-style:none;margin:0;padding:8px 34px 4px;background:linear-gradient(180deg,#FEF8F8,#FCF1F2)}
.ntc li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:26px 0;border-bottom:1px solid rgba(138,44,71,.18)}
.ntc li:last-child{border-bottom:0}
.ntc .no{font-size:20px;font-weight:500;color:#B9959E;letter-spacing:.02em}
.ntc h4{margin:0 0 12px;font-size:clamp(17px,2vw,20px);font-weight:700;color:#3A1F28;line-height:1.5;word-break:keep-all}
.ntc p{margin:0;color:#6A4A53;font-size:15.5px;line-height:1.95;white-space:pre-line;word-break:keep-all}
.ntc footer{padding:18px 34px 24px;background:#FCF1F2;border-top:1px solid rgba(138,44,71,.18);font-weight:700;color:#7A4A56;font-size:15px}
@media (max-width:560px){.ntc header,.ntc ol,.ntc footer{padding-left:20px;padding-right:20px}.ntc li{grid-template-columns:36px minmax(0,1fr);gap:6px;padding:20px 0}.ntc .no{font-size:16px}.ntc p{font-size:14.5px}}
.checks{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* ---- 제목 글자가 조금씩 출렁이는 애니메이션 ---- */
.wvw{display:inline}
.wv{display:inline-block;white-space:nowrap}
.wv>i{display:inline-block;font-style:normal;animation:wave 3.8s ease-in-out infinite;animation-delay:calc(var(--i) * .11s)}
@keyframes wave{0%,62%,100%{transform:translateY(0)}31%{transform:translateY(-.13em)}}
button,input,textarea,select{font-family:inherit}

/* ---- 분양 아바타 (따로, 눈에 띄게) ---- */
.adopt{border-top:0;padding-top:24px}
.adopt-list{display:grid;gap:28px}
.adopt-card{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:0;border:2px solid #D9899E;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#FBE3E8,#FDEEE6 55%,#F6D8DF);box-shadow:0 18px 44px rgba(138,44,71,.22)}
.adopt-card .pic{position:relative;display:block;width:100%;padding:0;border:0;background:var(--bg-2);aspect-ratio:var(--ratio,1/1);overflow:hidden}
.adopt-card .pic img,.adopt-card .pic video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.adopt-card:hover .pic img,.adopt-card:hover .pic video{transform:scale(1.03)}
.adopt-card .info-side{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:34px 38px;min-width:0}
.adopt-card .tag-open{align-self:flex-start;padding:5px 16px;border-radius:999px;background:linear-gradient(135deg,#8E2B48,#B5465F);color:#fff;font-size:13px;font-weight:700;letter-spacing:.08em;box-shadow:0 6px 14px rgba(138,44,71,.3)}
.adopt-card h3{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.4vw,36px);line-height:1.3;color:#5A1A2E;word-break:keep-all}
.adopt-card .desc{margin:0;color:#6A4A53;font-size:16px;line-height:1.8;word-break:keep-all;white-space:pre-line}
.adopt-card .pr{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--gold)}
.adopt-card .btn{align-self:flex-start;min-height:50px;font-size:15px}
@media (max-width:760px){.adopt-card{grid-template-columns:minmax(0,1fr)}.adopt-card .info-side{padding:24px 22px 28px}}

/* ---- 개성이 다른 얼굴들 (전/후) ---- */
.faces{border-top:0}
.faces-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;padding-bottom:24px;max-width:640px;margin:0 auto}
.ba{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.ba .arw{flex:none;font-size:26px;font-weight:700;color:var(--gold);line-height:1}
.face{position:relative;display:block;flex:1 1 0;min-width:0;max-width:260px;padding:0;border:1px solid var(--edge);border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--bg-2);box-shadow:0 10px 22px rgba(138,44,71,.14);transition:transform .3s ease}
.face.after{border-color:var(--edge-hi);box-shadow:0 12px 26px rgba(138,44,71,.26)}
.face:hover{transform:translateY(-4px)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.face .tagba{position:absolute;left:8px;top:8px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.88);color:var(--gold)}
.face.after .tagba{background:var(--gold);color:#fff}
.face .cap,.media .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;background:linear-gradient(180deg,transparent,rgba(74,26,42,.72));color:#fff;font-size:13px;font-weight:700;text-align:center;word-break:keep-all}
@media (max-width:640px){.faces-grid{gap:18px}.ba{gap:8px}.face{max-width:none}}
.sec-head p:empty{display:none}

/* ---- 분야 넘기기 화살표 ---- */
.tabrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:34px}
.tabrow .tabs{margin-bottom:0}
.tab-arrow{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge-hi);background:linear-gradient(135deg,#FFFFFF,#FBE3E8);color:#8A2C47;box-shadow:0 6px 16px rgba(138,44,71,.18);transition:transform .2s ease}
.tab-arrow:hover{transform:scale(1.08)}
.tab-arrow svg{width:22px;height:22px}
@media (max-width:560px){.tabrow{gap:8px}.tab-arrow{width:38px;height:38px}.tab-arrow svg{width:18px;height:18px}.tab{padding:0 16px;min-height:42px;font-size:15px}}


/* ---- 보유 아바타 ---- */
.owned{padding-top:24px}
.own-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;max-width:800px;margin:0 auto}
.own{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:3px 3px 9px;border:1px solid var(--edge);border-radius:12px;background:#fff;text-align:center;min-width:0;box-shadow:0 6px 16px rgba(138,44,71,.08);transition:transform .25s ease,box-shadow .25s ease}
a.own:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(138,44,71,.18)}
.own-pic{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#F8D6CC,#EBA9BC)}
.own-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.own-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.2vw,24px);font-weight:700;color:rgba(255,255,255,.9)}
.own-name{margin-top:9px;font-size:11px;font-weight:700;color:var(--ivory);word-break:keep-all}
.own-link{margin-top:4px;max-width:100%;font-size:9px;font-weight:700;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:clip;color:var(--gold);opacity:.75}
@media (max-width:1000px){.own-grid{grid-template-columns:repeat(6,minmax(0,1fr));max-width:640px}}
@media (max-width:560px){.own-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.own{padding:2px 2px 7px}.own-name{margin-top:7px}.own-name{font-size:10px}.own-link{font-size:8px}}

/* ---- 아트머그 메뉴판 (드롭다운) ---- */
.menu{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mlab{padding-top:10px;font-weight:700;color:var(--ivory);word-break:keep-all}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mline{display:flex;align-items:center;gap:8px;min-width:0}
.mline select{flex:1 1 auto;min-width:0;width:100%;padding:10px 12px;border:1px solid var(--edge);border-radius:12px;background:#fff;color:var(--ivory);font:inherit;font-size:14px;text-overflow:ellipsis}
.mline select:focus{outline:2px solid var(--edge-hi);outline-offset:1px}
.mline .qty{flex:none;width:64px;padding:9px 8px;border:1px solid var(--edge);border-radius:12px;font:inherit;text-align:center}
.mline .unit{flex:none;color:var(--muted);font-size:14px}
.mcol .more{align-self:flex-start;padding:6px 12px;border:1px dashed var(--edge-hi);border-radius:999px;background:transparent;color:var(--gold);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
@media (max-width:640px){.mrow{grid-template-columns:minmax(0,1fr);gap:6px}.mlab{padding-top:0}}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}.wv>i{animation:none}.card:hover,.btn:hover{transform:none}.card:hover .media img,.card:hover .media video{transform:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#home" aria-label="맨 위로"><b id="logoTitle"></b><small id="logoTag"></small></a>
    <nav aria-label="메뉴"><ul id="nav"></ul></nav>
    <a class="btn sm" id="ctaTop" hidden></a>
  </div>
</header>

<main>
  <section class="wrap hero" id="home">
    <div class="copy">
      <p class="eyebrow" id="eyebrow" hidden></p>
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroDesc"></p>
      <ul class="tags" id="heroTags"></ul>
      <a class="btn" id="ctaHero"></a>
    </div>
    <figure class="art" id="art" hidden>
      <button type="button" id="artBtn" aria-label="대표 작업물 크게 보기"></button>
      <figcaption id="artCap"></figcaption>
    </figure>
  </section>

  <section class="wrap strengths" id="strengths" aria-label="강점">
    <div class="band"><h2 id="bandTitle"></h2><ul id="bandList"></ul></div>
  </section>

  <section class="wrap sec guide process" id="process">
    <div class="sec-head" data-eb="PROCESS"><h2 id="procTitle"></h2><p id="procLead"></p></div>
    <div class="paper"><ol class="steps" id="steps"></ol></div>
  </section>

  <section class="wrap sec faces" id="faces" hidden>
    <div class="sec-head" data-eb="FACES"><h2 id="fcTitle"></h2><p id="fcLead"></p></div>
    <div class="faces-grid" id="facesGrid"></div>
  </section>

  <section class="wrap sec" id="portfolio">
    <div class="sec-head" data-eb="PORTFOLIO"><h2 id="pfTitle"></h2><p id="pfLead"></p></div>
    <div class="tabrow">
      <button type="button" class="tab-arrow" id="tabPrev" aria-label="이전 분야 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tabs" id="tabs" role="tablist" aria-label="작업 분야"></div>
      <button type="button" class="tab-arrow" id="tabNext" aria-label="다음 분야 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="tabPanel" role="tabpanel" tabindex="-1"></div>
  </section>

  <section class="wrap sec owned" id="owned" hidden>
    <div class="sec-head" data-eb="OWNED AVATARS"><h2 id="owTitle"></h2><p id="owLead"></p></div>
    <div class="own-grid" id="ownGrid"></div>
  </section>

  <section class="wrap sec adopt" id="adopt" hidden>
    <div class="sec-head" data-eb="ADOPTION"><h2 id="adTitle"></h2><p id="adLead"></p></div>
    <div class="adopt-list" id="adoptList"></div>
  </section>


  <section class="wrap sec" id="estimate">
    <div class="sec-head" data-eb="ESTIMATE &amp; APPLICATION"><h2 id="estTitle"></h2><p id="estLead"></p></div>
    <div class="est">
      <div class="est-left">
        <div class="box" id="estForm"></div>
        <div class="box" id="applyBox"><h3 class="bt"><span class="no">02</span>신청 정보</h3><p class="bt-sub" id="applyLead"></p><div id="applyFields"></div></div>
      </div>
      <aside class="sum" aria-label="선택 내역">
        <h3>선택 내역</h3>
        <ul class="lines" id="lines"></ul>
        <div class="total" aria-live="polite"><div class="k">예상 합계</div><div class="v" id="totalV"></div><div class="sub" id="totalSub"></div></div>
        <label class="agree"><input type="checkbox" id="agree"><span id="agreeTx"></span></label>
        <a class="btn" id="askBtn"></a>
        <button type="button" class="btn ghost reset" id="resetBtn">처음부터 다시 선택</button>
        <ul class="notes" id="estNotes"></ul>
      </aside>
    </div>
  </section>

  <section class="wrap sec" id="faq" hidden>
    <div class="sec-head" data-eb="FAQ"><h2 id="faqTitle">자주 묻는 질문</h2></div>
    <div class="faq" id="faqList"></div>
  </section>

  <section class="wrap sec" id="reviews" hidden>
    <div class="sec-head" data-eb="REVIEW"><h2>이용 후기</h2></div>
    <div class="revs" id="revs"></div>
  </section>

  <section class="wrap sec" id="noticeSec">
    <article class="ntc" id="notice" aria-labelledby="ntcTitle">
      <header><p class="en" id="ntcEn"></p><h3 id="ntcTitle"></h3><p class="sub" id="ntcSub"></p></header>
      <ol id="ntcList"></ol>
      <footer id="ntcFoot"></footer>
    </article>
  </section>

  <section class="wrap contact" id="contact">
    <div class="cta-box"><h2 id="cTitle"></h2><p id="cDesc"></p><a class="btn" id="cBtn"></a></div>
  </section>
</main>

<footer><div class="wrap"><span id="foot"></span><a id="footLink">아트머그 페이지</a></div></footer>

<aside id="quick" aria-label="빠른 메뉴"><div class="q-t">MENU<small>QUICK GUIDE</small></div><ul id="quickList"></ul><a href="#home" class="q-top">↑ TOP</a></aside>
<a href="#home" id="toTop" aria-label="맨 위로">↑</a>

<div id="toast" role="status" aria-live="polite"></div>

<dialog class="lb" id="lb" aria-label="확대 보기">
  <div class="lb-wrap" id="lbWrap">
    <div class="lb-count" id="lbCount" aria-live="polite"></div>
    <button class="lb-close" id="lbClose" aria-label="닫기">&times;</button>
    <button class="nav prev" id="lbPrev" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="lb-body" id="lbBody"></div>
    <div class="lb-cap" id="lbCap"></div>
    <button class="nav next" id="lbNext" aria-label="다음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
(function(){
  var cfg = window.PORTFOLIO || {};
  var site = cfg.site || {}, intro = cfg.intro || {}, guide = cfg.guide || {}, pr = cfg.pricing || {}, ct = cfg.contact || {};
  var $ = function(s,r){return (r||document).querySelector(s)};
  function el(tag, attrs, kids){

    }
    (kids||[]).forEach(function(c){ if (c) n.appendChild(c); });
    return n;
  }
  function setLink(a, url){ a.href = url || '#'; if (/^https?:/i.test(url||'')) { a.target = '_blank'; a.rel = 'noopener'; } }
  function svg(path, cls){
    var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor');
    s.setAttribute('stroke-width','1.7'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.setAttribute('aria-hidden','true');
    if (cls) s.setAttribute('class', cls);
    s.innerHTML = path; return s;
  }
  var ICON = {
    chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
    doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13l2 2 4-4"/>',
    tool:'<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19l-3-3 7.5-7.5"/><path d="M6 20l-2-2 4-4"/>',
    box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
    shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    spark:'<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/><path d="M19 4v3M17.5 5.5h3"/>',
    calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    pencil:'<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',
    folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
    vr:'<rect x="3" y="8" width="18" height="9" rx="3"/><path d="M9 17v-2h6v2"/><circle cx="8" cy="12.5" r="1"/><circle cx="16" cy="12.5" r="1"/>',
    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    dot:'<path d="M12 5l1.8 4.7L18.5 11l-4.7 1.3L12 17l-1.8-4.7L5.5 11l4.7-1.3z"/>'
  };
  var CHAT = '<path d="M4 5h16v11H9l-5 4z"/><circle cx="9" cy="10.5" r=".6" fill="currentColor"/><circle cx="12" cy="10.5" r=".6" fill="currentColor"/><circle cx="15" cy="10.5" r=".6" fill="currentColor"/>';

  function kind(it){
    if (it.type) return it.type;
    var ext = (String(it.src||'').split('?')[0].split('.').pop() || '').toLowerCase();
    return (ext === 'mp4' || ext === 'webm' || ext === 'mov') ? 'video' : 'image';
  }
  /* 작은 미리보기: media/<폴더>/NN.png → media/thumbs/<폴더>/NN.jpg (없으면 원본을 씁니다) */
  function thumbOf(it){
    if (it.thumb) return it.thumb;
    var m = String(it.src||'').match(/^media\/([^\/]+)\/([^\/]+)\.[a-z0-9]+$/i);
    return m ? ('media/thumbs/' + m[1] + '/' + m[2] + '.jpg') : it.src;
  }
  function placeholder(t){ return el('div',{'class':'ph',text:t}); }

  /* ---------- 영상: 화면에 보일 때만 재생 ---------- */
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){

  function lockMute(v){ v.muted = true; v.addEventListener('volumechange', function(){ if (!v.muted) v.muted = true; }); return v; }

  function makeNode(it, o){

    if (kind(it) === 'video') {
      var v = el('video',{muted:'',loop:'',playsinline:'',preload: o.full ? 'auto' : 'none'});

        var line = el('div',{'class':'mline'});
        var sel = el('select',{'aria-label':g.label + ' 선택'});
        sel.appendChild(el('option',{value:'-1',text:'선택하세요.'}));
        (g.options || []).forEach(function(o, oi){
          var op = el('option',{value:String(oi),text:optText(o)});
          if (o.header) op.disabled = true;
          if (isNum(o.percent)) { op.setAttribute('data-pct', String(o.percent)); op.setAttribute('data-label', o.label); }
          sel.appendChild(op);
        });
        sel.value = String(sl.i);
        sel.addEventListener('change', function(){ sl.i = parseInt(sel.value, 10); sl.q = 1; if (sl.i < 0 && ss.length > 1) ss.splice(si, 1); buildMenu(); refreshAll(); });
        line.appendChild(sel);
        var o = sl.i > -1 ? g.options[sl.i] : null;
        if (o && o.unit) {
          var q = el('input',{type:'number',min:'1',max:'99',value:String(sl.q),'class':'qty','aria-label':'개수'});
          q.addEventListener('input', function(){ var n = parseInt(q.value, 10); sl.q = (isNaN(n) || n < 1) ? 1 : Math.min(99, n); refreshAll(); });
          line.appendChild(q); line.appendChild(el('span',{'class':'unit',text:o.unit}));
        }
        col.appendChild(line);
      });
      if (ss.every(function(s){ return s.i > -1; })) {
        var more = el('button',{type:'button','class':'more',text:'＋ ' + g.label + ' 하나 더 고르기'});
        more.addEventListener('click', function(){ ss.push({ i: -1, q: 1 }); buildMenu(); });
        col.appendChild(more);
      }
      row.appendChild(col); menuBox.appendChild(row);
    });
  }

  st.kind = kinds.length ? kinds[0].id : null; st.plat = []; st.add = [];
  var form = $('#estForm');
  form.appendChild(el('h3',{'class':'bt'},[ el('span',{'class':'no',text:'01'}), document.createTextNode('작업 항목 선택') ]));
  if (menu.length) buildMenu();

  function group(title, hint, type, items, getOn, toggle){
    var fs = el('fieldset',{'class':'fs'});
    var lg = el('legend',{text:title}); if (hint) lg.appendChild(el('span',{'class':'hint',text:hint}));
    fs.appendChild(lg);
    var wrap = el('div',{'class':'opts'});
    items.forEach(function(o){
      var inp = el('input',{type:type,name:'g-'+title,value:o.id});
      var lab = el('label',{'class':'opt'},[ inp, el('span',{text:o.label}), o.desc ? el('small',{text:o.desc}) : null ]);
      function sync(){ lab.classList.toggle('on', getOn(o.id)); inp.checked = getOn(o.id); }
      inp.addEventListener('change', function(){ toggle(o.id); refreshAll(); });
      lab._sync = sync; wrap.appendChild(lab);
    });
    fs.appendChild(wrap); form.appendChild(fs); return wrap;
  }
  function has(arr, id){ return arr.indexOf(id) > -1; }
  function flip(arr, id){ var i = arr.indexOf(id); if (i > -1) arr.splice(i,1); else arr.push(id); }
  var wraps = [];
  if (kinds.length) wraps.push(group('작업 종류','하나 선택','radio',kinds,function(id){return st.kind===id;},function(id){st.kind=id;}));
  if (plats.length) wraps.push(group('사용 플랫폼','여러 개 선택 가능','checkbox',plats,function(id){return has(st.plat,id);},function(id){flip(st.plat,id);}));
  if (addons.length) wraps.push(group('추가 옵션','여러 개 선택 가능','checkbox',addons,function(id){return has(st.add,id);},function(id){flip(st.add,id);}));
  function find(arr, id){ var r = null; arr.forEach(function(o){ if (o.id === id) r = o; }); return r; }

  function current(){
    var rows = [];
    var k = find(kinds, st.kind); if (k) rows.push({ k:'작업 종류', label:k.label, price:k.price });
    st.plat.forEach(function(id){ var p = find(plats,id); if (p) rows.push({ k:'플랫폼', label:p.label, price:p.price }); });
    st.add.forEach(function(id){ var a = find(addons,id); if (a) rows.push({ k:'추가 옵션', label:a.label, price:a.price }); });
    var pct = [], sub = 0;
    menu.forEach(function(g){
      slots(g).forEach(function(sl){
        if (sl.i < 0) return;
        var o = g.options[sl.i]; if (!o || o.header) return;
        if (isNum(o.percent)) { var r0 = { k:g.label, label:o.label, price:null, pct:o.percent }; rows.push(r0); pct.push(r0); return; }
        var q = o.unit ? sl.q : 1, r = { k:g.label, label:o.label + (o.unit ? ' × ' + q + o.unit : ''), price: isNum(o.price) ? o.price * q : null };
        if (isNum(r.price)) sub += r.price;
        rows.push(r);
      });
    });
    pct.forEach(function(r){ r.price = Math.round(sub * r.pct / 100); });
    return rows;
  }
  /* 신청 정보 입력칸 (config.form 에서 글자 수정) */
  var fm = cfg.form || {};
  $('#applyLead').textContent = fm.lead || '';
  var fields = fm.fields || [], fvals = {};
  fields.forEach(function(f){
    var inp = f.type === 'text' ? el('input',{type:'text',placeholder:f.placeholder||'',autocomplete:'off'}) : el('textarea',{placeholder:f.placeholder||'',rows:3});
    inp.addEventListener('input', function(){ fvals[f.id] = inp.value; });
    f._el = inp;
    $('#applyFields').appendChild(el('label',{'class':'fld'},[ el('span',{text:f.label||''}), inp ]));
  });
  if (!fields.length) $('#applyBox').hidden = true;
  function summaryText(rows){
    if (menu.length) {
      var tt = totals(rows), L = [ pr.copyIntro || '[견적 문의]' ];
      if (!rows.length) L.push('선택한 항목: 없음');
      rows.forEach(function(r){ L.push(r.k + ': ' + r.label + (isNum(r.price) ? ' (' + money(r.price) + ')' : ' (문의)')); });
      if (anyPrice && rows.length) L.push('예상 금액: ' + money(tt.sum) + (tt.unknown ? ' (+ 상담 후 확정 ' + tt.unknown + '개 항목)' : ''));
      fields.forEach(function(f){ var v = (f._el.value || '').trim(); L.push('', '▪ ' + (f.label||'') + ':' + (v ? '\n' + v : ' ')); });
      if (!fields.length && pr.copyFooter) L.push('', pr.copyFooter);
      return L.join('\n');
    }
    var kRow = rows.filter(function(r){return r.k==='작업 종류';})[0];
    var pl = rows.filter(function(r){return r.k==='플랫폼';}).map(function(r){return r.label;});
    var ad = rows.filter(function(r){return r.k==='추가 옵션';}).map(function(r){return r.label;});
    var tot = totals(rows);
    var lines = [ pr.copyIntro || '[견적 문의]',
      '작업 종류: ' + (kRow ? kRow.label : '선택 안 함'),
      '사용 플랫폼: ' + (pl.length ? pl.join(', ') : '선택 안 함'),
      '추가 옵션: ' + (ad.length ? ad.join(', ') : '없음') ];
    if (anyPrice) lines.push('예상 금액: ' + money(tot.sum) + (tot.unknown ? ' (+ 상담 후 확정 ' + tot.unknown + '개 항목)' : ''));
    fields.forEach(function(f){ var v = (f._el.value || '').trim(); lines.push('', '▪ ' + (f.label||'') + ':' + (v ? '\n' + v : ' ')); });
    if (!fields.length && pr.copyFooter) lines.push('', pr.copyFooter);
    return lines.join('\n');
  }
  function totals(rows){
    var sum = 0, unknown = 0;
    rows.forEach(function(r){ if (isNum(r.price)) sum += r.price; else unknown++; });
    return { sum: sum, unknown: unknown };
  }
  function refreshAll(){
    form.querySelectorAll('label.opt').forEach(function(l){ l._sync(); });
    var rows = current(), box = $('#lines'); box.innerHTML = '';
    if (menuBox) {
      var base = 0; rows.forEach(function(r){ if (!r.pct && isNum(r.price)) base += r.price; });
      menuBox.querySelectorAll('option[data-pct]').forEach(function(op){
        op.textContent = op.getAttribute('data-label') + '  →  + ' + money(Math.round(base * Number(op.getAttribute('data-pct')) / 100));
      });
    }
    if (!rows.length) box.appendChild(el('li',{},[ el('span',{text:'선택한 항목이 없어요'}) ]));
    rows.forEach(function(r){
      var right = (anyPrice && isNum(r.price)) ? el('span',{'class':'amt',text:money(r.price)}) : el('span',{text: anyPrice ? '상담 후 안내' : ''});
      box.appendChild(el('li',{},[ el('span',{text:r.k}), el('span',{},[ document.createTextNode(r.label + (anyPrice ? '  ' : '')), right ]) ]));
    });
    var t = totals(rows), v = $('#totalV'), sub = $('#totalSub');
    if (!anyPrice) {
      v.textContent = '금액은 상담에서 안내해 드려요'; v.className = 'v txt'; sub.textContent = '';
    } else {
      v.className = 'v'; v.textContent = money(t.sum);
      sub.textContent = t.unknown ? ('외 ' + t.unknown + '개 항목은 상담 후 확정돼요') : '';
    }
  }
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }
  function copyText(text){
    return new Promise(function(res, rej){
      function legacy(){
        try { var ta = el('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
          document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove(); ok ? res() : rej(); } catch(e){ rej(e); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(res, legacy); else legacy();
    });
  }
  var ask = $('#askBtn');
  ask.textContent = pr.button || '복사하여 문의하기';
  setLink(ask, (ct.url || ctaUrl));
  var agree = $('#agree'), rst = $('#resetBtn');
  $('#agreeTx').textContent = pr.agree || '의뢰 전 확인사항을 읽었어요';
  function gate(){
    var ok = agree.checked;
    ask.setAttribute('aria-disabled', ok ? 'false' : 'true');
  }
  agree.addEventListener('change', gate); gate();
  rst.addEventListener('click', function(){
    st.kind = kinds.length ? kinds[0].id : null; st.plat = []; st.add = []; st.menu = {}; if (menu.length) buildMenu();
    fields.forEach(function(f){ f._el.value = ''; });
    agree.checked = false; gate(); refreshAll(); toast('선택 내용을 처음 상태로 되돌렸어요');
  });
  ask.addEventListener('click', function(e){
    if (!agree.checked) { e.preventDefault(); return; }
    copyText(summaryText(current())).then(function(){ toast('선택 내용을 복사했어요. 아트머그 문의 글에 붙여넣어 주세요'); }, function(){ toast('복사하지 못했어요. 선택 내용을 직접 적어 주세요'); });
  });

  var notes = (pr.notes || []).slice();
  if (pr.checkedAt) notes.push('금액 기준일: ' + pr.checkedAt);
  notes.forEach(function(t){ $('#estNotes').appendChild(el('li',{text:t})); });
  if (kinds.length || plats.length || addons.length || menu.length) refreshAll(); else $('#estimate').hidden = true;

  /* ---------- 후기 ---------- */
  var revs = (cfg.reviews || []).filter(function(r){ return r && r.text; });
  if (revs.length) {
    $('#reviews').hidden = false;
    revs.forEach(function(r){
      var f = el('figure',{'class':'rev'},[ el('blockquote',{text:r.text}) ]);
      if (r.image) { var im = el('img',{alt:'',loading:'lazy'}); im.src = r.image; im.onerror = function(){ im.remove(); }; f.appendChild(im); }
      if (r.name) f.appendChild(el('figcaption',{text:r.name}));
      $('#revs').appendChild(f);
    });
  }

  /* ---------- 자주 묻는 질문 (config.faq 에 넣으면 나타나요) ---------- */
  var faqs = (cfg.faq || []).filter(function(q){ return q && q.q && q.a; });
  if (faqs.length) {
    $('#faq').hidden = false; $('#faqTitle').textContent = cfg.faqTitle || '자주 묻는 질문';
    faqs.forEach(function(q, i){
      var n = (i + 1 < 10 ? '0' : '') + (i + 1);
      $('#faqList').appendChild(el('details',{},[ el('summary',{},[ el('i',{text:n}), document.createTextNode(q.q) ]), el('div',{'class':'ans',text:q.a}) ]));
    });
  }

  /* ---------- 마지막 문의 · 맺음 ---------- */
  $('#cTitle').textContent = ct.title || '';
  $('#cDesc').textContent = ct.desc || '';
  if (ct.show === false) $('#contact').hidden = true;
  var cb = $('#cBtn');
  if (showCta === false) cb.hidden = true;
  else { cb.textContent = ct.label || ctaLabel; setLink(cb, ct.url || ctaUrl); cb.insertBefore(svg(CHAT), cb.firstChild); cb.appendChild(document.createTextNode(' ›')); }
  $('#foot').textContent = '© ' + (site.title || '');
  setLink($('#footLink'), ct.url || ctaUrl);

  /* ---------- 상단 메뉴 (눌러서 해당 섹션으로 이동) ---------- */
  var navItems = [];
  if (!$('#process').hidden) navItems.push(['진행 과정','process']);
  navItems.push(['포트폴리오','portfolio']);
  if (!$('#owned').hidden) navItems.push(['보유 아바타','owned']);
  if (adoptItems) navItems.push(['분양','adopt']);
  if (!$('#estimate').hidden) navItems.push(['견적','estimate']);
  if (faqs.length) navItems.push(['질문','faq']);
  if (revs.length) navItems.push(['후기','reviews']);
  if (!$('#noticeSec').hidden) navItems.push(['확인사항','notice']);
  if (ct.show !== false) navItems.push(['문의','contact']);
  navItems.forEach(function(n){ var a = el('a',{href:'#'+n[1],text:n[0]}); $('#nav').appendChild(el('li',{},[a])); });

  /* 오른쪽 빠른 메뉴 (넓은 화면) + 맨 위로 버튼 */
  var quickLinks = [];
  [['첫 화면','home']].concat(navItems).forEach(function(n){
    var a = el('a',{href:'#'+n[1],text:n[0]}); quickLinks.push([a, n[1]]); $('#quickList').appendChild(el('li',{},[a]));
  });
  var toTop = $('#toTop');
  function onScroll(){
    toTop.classList.toggle('show', (vp && isTall() ? vp.top : window.scrollY) > 600);
    var inVp = !!(vp && isTall()), cur = null, line = inVp ? vp.top + vp.h * 0.35 : window.innerHeight * 0.35;
    quickLinks.forEach(function(q){ var s = document.getElementById(q[1]); if (s && !s.hidden && s.getBoundingClientRect().top <= line) cur = q[1]; });
    quickLinks.forEach(function(q){ q[0].classList.toggle('on', q[1] === cur); });
  }
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

  /* 제목 글자 출렁임: 글자마다 시차를 두어 물결처럼 움직여요 (움직임 줄이기 설정이면 멈춰요) */
  function wave(node){
    var txt = node.textContent; if (!txt.trim()) return;
    node.setAttribute('aria-label', txt.replace(/\n/g,' '));
    node.textContent = '';
    var wrap = el('span',{'class':'wvw','aria-hidden':'true'}), idx = 0;
    txt.split('\n').forEach(function(line, li){
      if (li) wrap.appendChild(el('br'));
      var words = line.split(' ').filter(Boolean);
      words.forEach(function(w, wi){
        var s = el('span',{'class':'wv'});
        w.split('').forEach(function(ch){ var i = el('i',{text:ch}); i.style.setProperty('--i', idx++); s.appendChild(i); });
        wrap.appendChild(s);
        if (wi < words.length - 1) wrap.appendChild(document.createTextNode(' '));
      });
      idx++;
    });
    node.appendChild(wrap);
  }
  Array.prototype.forEach.call(document.querySelectorAll('#heroTitle,.sec-head h2,.band h2,.cta-box h2,.ntc h3,.paper h3.pt'), wave);

  /* iframe 임베드용: 부모 창에 높이 전달 */
  if ((cfg.options||{}).autoHeight !== false && window.parent !== window && 'ResizeObserver' in window) {
    var last = 0;
    new ResizeObserver(function(){
      var h = document.documentElement.scrollHeight;
      if (Math.abs(h-last) > 1) { last = h; window.parent.postMessage({type:'portfolio-height',height:h},'*'); }
    }).observe(document.body);
  }
})();
</script>
</body>
</html>
